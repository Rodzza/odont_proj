# Análise do SonarQube (ci/sonarqube.sh roda em todo pull request).
sonar.projectName=OdontoNotes
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,backend/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,frontend/src/test/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
